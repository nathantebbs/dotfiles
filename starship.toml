# Single line, like the zsh "mh" theme this replaces.
#
# `format` is explicit, so only the modules named below ever render. That is
# the point: starship enables about forty modules by default, and every one
# of them is a subprocess or a stat() on some prompts.

add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold cyan"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"

# Under two seconds the number is noise.
[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

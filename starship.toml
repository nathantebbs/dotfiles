# Single line, like the zsh "mh" theme this replaces.
#
# `format` is explicit, so only the modules named below ever render. That is
# the point: starship enables about forty modules by default, and every one
# of them is a subprocess or a stat() on some prompts.
#
# Colors are starship's names, not ANSI's. There is no "magenta", only
# "purple", and an unrecognized name renders unstyled without a warning.

add_newline = false

format = """
$directory\
$git_branch\
$character"""

# One component. The full path is what `pwd` is for.
[directory]
truncation_length = 1
truncate_to_repo = false
style = "bold cyan"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "bold purple"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
